dataset: multi_task
arch: unireg_rpn


compute_size: [192, 224, 160]

use_pre_align: false


task_type: inter-subject
task_type_id: 0
task_id: brain
task_id_id: 5


sim_loss: ncc
ncc_win: 9
sim_weight: 1.0

reg_loss: grad_l2
reg_weight: 1.0

lr: 1.0e-5
batch_size: 1
num_workers: 4

epochs: 1000
max_steps: 150000
val_every: 1000
save_every: 1000
num_repeats: 10
seed: 42
amp: true
eval_in_raw: false

log_dir: ./logs/unireg_rpn_6task_from_brain

tasks:
  - name: acdc
    sampling_weight: 4
    dataset: acdc
    compute_size: [16, 128, 128]

    task_type: intra-subject
    task_type_id: 1
    task_id: acdc
    task_id_id: 4

    use_pre_align: false

    norm_strategy: mri_percentile
    pair_json: ${DATA_ROOT}/ACDC/ACDC_pairs.json

    train_root: ${DATA_ROOT}/ACDC/imagesTr
    train_seg_root: ${DATA_ROOT}/ACDC/labelsTr
    val_root: ${DATA_ROOT}/ACDC/imagesTr
    val_seg_root: ${DATA_ROOT}/ACDC/labelsTr
    test_root: ${DATA_ROOT}/ACDC/imagesTs
    test_seg_root: ${DATA_ROOT}/ACDC/labelsTs

    sim_loss: ncc
    ncc_win: [3, 9, 9]
    sim_weight: 1.0
    reg_loss: grad_l2
    reg_weight: 0.5

  - name: liver
    sampling_weight: 2
    dataset: liver_unified
    compute_size: [160, 192, 192]

    task_type: intra-subject
    task_type_id: 1
    task_id: liver
    task_id_id: 3

    use_pre_align: false

    sim_loss: ncc
    ncc_win: 9
    sim_weight: 1.0
    reg_loss: grad_l2
    reg_weight: 10.0

  - name: head
    sampling_weight: 2
    dataset: head_unified
    compute_size: [160, 192, 192]

    task_type: inter-subject
    task_type_id: 0
    task_id: head
    task_id_id: 2

    use_pre_align: true

    sim_loss: ncc
    ncc_win: 9
    sim_weight: 1.0
    reg_loss: grad_l2
    reg_weight: 1.0

  - name: abdomen
    sampling_weight: 2
    dataset: abdomen_unified
    compute_size: [160, 192, 192]

    task_type: inter-subject
    task_type_id: 0
    task_id: abdomen
    task_id_id: 1

    use_pre_align: true

    sim_loss: ncc
    ncc_win: 9
    sim_weight: 1.0
    reg_loss: grad_l2
    reg_weight: 1.0

  - name: chest
    sampling_weight: 2
    dataset: chest_unified
    compute_size: [160, 192, 192]

    task_type: inter-subject
    task_type_id: 0
    task_id: chest
    task_id_id: 0

    use_pre_align: true

    sim_loss: ncc
    ncc_win: 9
    sim_weight: 1.0
    reg_loss: grad_l2
    reg_weight: 1.0

  - name: brain
    sampling_weight: 2
    dataset: oasis
    compute_size: [192, 224, 160]

    task_type: inter-subject
    task_type_id: 0
    task_id: brain
    task_id_id: 5

    use_pre_align: false

    pair_json: ${DATA_ROOT}/OASIS/LUMIR_train_OASIS_val_test500.json

    train_root: ${DATA_ROOT}/LUMIR/imagesTr
    train_seg_root:

    val_root: ${DATA_ROOT}/OASIS/imagesTr
    val_seg_root: ${DATA_ROOT}/OASIS/labelsTr
    val_mask_root: ${DATA_ROOT}/OASIS/masksTr

    test_root: ${DATA_ROOT}/OASIS/imagesTr
    test_seg_root: ${DATA_ROOT}/OASIS/labelsTr
    test_mask_root: ${DATA_ROOT}/OASIS/masksTr

    sim_loss: ncc
    ncc_win: 9
    sim_weight: 1.0
    reg_loss: grad_l2
    reg_weight: 1.0